name: Mathaba Web CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build and type-check
        run: |
          npm run test
          npm run build
          npm run typecheck
      - name: Guard against premature app launch claims
        run: |
          if grep -R -E 'Google Play|App Store' app lib/content.ts | grep -E 'download now|available now' ; then
            echo "Review app-store claims before publication"
            exit 1
          fi
